name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For a concrete, actionable feature. To explore an idea first, start a thread in
        [Discussions → Ideas](https://github.com/m7ghareeb/window-swipe/discussions/categories/ideas).
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or situation behind the idea.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Your idea
      description: How should it work? For a new animation profile or sensitivity preset, describe the feel you are aiming for and how it differs from the existing ones.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself and open a pull request.
