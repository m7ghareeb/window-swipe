name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please check the README's
        *Troubleshooting and FAQ* section and the existing issues first.
        For security problems, use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open two windows ...
        2. Swipe left with three fingers ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Window Swipe version
      description: Shown in System Settings → Extensions, or in metadata.json.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and Cinnamon version
      description: "Output of `cinnamon --version` and your distribution, e.g. Linux Mint 22.3"
    validations:
      required: true
  - type: input
    id: touchegg
    attributes:
      label: Touchégg version
      description: "Output of `touchegg --version`"
  - type: dropdown
    id: settings
    attributes:
      label: Does it happen with the default settings (Calm, Balanced, Plank order, three and four fingers)?
      options:
        - "Yes"
        - "No, only with other settings (please describe below)"
        - "Not tried"
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: Lines containing `window-swipe` from `~/.xsession-errors` or Looking Glass (`Alt+F2`, `lg`).
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Screen recordings, Plank or multi-monitor setup, touchpad model, ...
